[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptoradar-oss"
version = "0.1.0"
description = "Open-source crypto research and backtesting primitives."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "shop2568"}]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
